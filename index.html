<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge All Calculator</title>
    <link rel="icon" type="image/png" href="tier2.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: #fff;
        }

        .calculator {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 25px;
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 12px;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 30px;
        }

        .description {
            margin-top: 10px;
            margin-bottom: 25px;
            text-align: center;
            color: #aaa;
            font-size: 15px;
        }

        .tiers {
            display: grid;
            grid-template-columns: 1fr 120px;
            gap: 8px 15px;
        }

        .tier-label {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
        }

        .tier-image {
            width: 40px;
            height: 40px;
            object-fit: contain;
            flex-shrink: 0;
            border-radius: 6px;
        }

        input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #111;
            color: #fff;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #777;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            margin: 0;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: opacity 0.15s;
        }

        button:hover {
            opacity: 0.8;
        }

        #calculate {
            background: #fff;
            color: #000;
        }

        #reset {
            background: #333;
            color: #fff;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 18px;
            background: #111;
            border-radius: 8px;
        }

        #result h2 {
            margin-top: 0;
        }

        .highest {
            margin-bottom: 15px;
            font-size: 17px;
            font-weight: bold;
        }

        .result-tier {
            padding: 4px 0;
            font-size: 16px;
        }

        .warning {
            margin-top: 12px;
            color: #777;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            body {
                padding: 15px 8px;
            }

            .calculator {
                padding: 18px;
            }

            h1 {
                font-size: 24px;
            }

            .tiers {
                grid-template-columns: 1fr 90px;
            }

            .tier-image {
                width: 34px;
                height: 34px;
            }
        }
    </style>
</head>

<body>

<div class="calculator">
    <h1>Merge All Calculator</h1>

    <div class="description">
        Enter how many balls you have for each tier.
    </div>

    <div class="tiers" id="tiers"></div>

    <div class="buttons">
        <button id="calculate">Calculate</button>
        <button id="reset">Reset</button>
    </div>

    <div id="result"></div>
</div>

<script>
const MAX_TIER = 20;
const MAX_AMOUNT = 200;

const tierImages = {
    1: "tier1.png",
    2: "tier2.png",
    3: "tier3.png",
    4: "tier4.png",
    5: "tier5.png",
    6: "tier6.png",
    7: "tier7.png",
    8: "tier8.png",
    9: "tier9.png",
    10: "tier10.png",
    11: "tier11.png",
    12: "tier12.png",
    13: "tier13.png",
    14: "tier14.png",
    15: "tier15.png",
    16: "tier16.png",
    17: "tier17.png",
    18: "tier18.png",
    19: "tier19.png",
    20: "tier20.png"
};

const tiersContainer = document.getElementById("tiers");
const result = document.getElementById("result");

for (let tier = 1; tier <= MAX_TIER; tier++) {
    const label = document.createElement("div");
    label.className = "tier-label";

    const image = document.createElement("img");
    image.src = tierImages[tier];
    image.alt = "Tier " + tier;
    image.className = "tier-image";

    const text = document.createElement("span");
    text.textContent = "Tier " + tier;

    label.appendChild(image);
    label.appendChild(text);

    const input = document.createElement("input");
    input.type = "number";
    input.min = "0";
    input.max = MAX_AMOUNT;
    input.value = "0";
    input.id = "tier-" + tier;
    input.setAttribute("aria-label", "Tier " + tier + " amount");

    tiersContainer.appendChild(label);
    tiersContainer.appendChild(input);
}

document.getElementById("calculate").addEventListener("click", function () {
    const balls = [];

    for (let tier = 1; tier <= MAX_TIER; tier++) {
        const input = document.getElementById("tier-" + tier);

        let amount = parseInt(input.value, 10);

        if (Number.isNaN(amount)) {
            amount = 0;
        }

        amount = Math.max(0, Math.min(MAX_AMOUNT, amount));
        input.value = amount;
        balls[tier] = amount;
    }

    for (let tier = 1; tier < MAX_TIER; tier++) {
        const mergeAmount = Math.floor(balls[tier] / 2);

        balls[tier] = balls[tier] % 2;
        balls[tier + 1] += mergeAmount;
    }

    let highestTier = 0;

    for (let tier = MAX_TIER; tier >= 1; tier--) {
        if (balls[tier] > 0) {
            highestTier = tier;
            break;
        }
    }

    result.style.display = "block";

    if (highestTier === 0) {
        result.innerHTML = `
            <h2>Result</h2>
            <div>No balls entered.</div>
        `;
        return;
    }

    let html = `
        <h2>Result</h2>
        <div class="highest">
            Highest tier: Tier ${highestTier}
        </div>
        <strong>After merging:</strong>
        <br><br>
    `;

    for (let tier = MAX_TIER; tier >= 1; tier--) {
        if (balls[tier] > 0) {
            html += `
                <div class="result-tier">
                    Tier ${tier} ×${balls[tier]}
                </div>
            `;
        }
    }

    html += `
        <div class="warning">
            Starting amounts are limited to ${MAX_AMOUNT} balls per tier.
        </div>
    `;

    result.innerHTML = html;
});

document.getElementById("reset").addEventListener("click", function () {
    for (let tier = 1; tier <= MAX_TIER; tier++) {
        document.getElementById("tier-" + tier).value = "0";
    }

    result.style.display = "none";
    result.innerHTML = "";
});
</script>

</body>
</html>
